<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo Circuit 3D : une puce en perspective isométrique, pistes de circuit sur le dessus -->
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3a18"/>
      <stop offset="1" stop-color="#05170a"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#082a11"/>
      <stop offset="1" stop-color="#030f06"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="#000"/>
  <rect x="10" y="10" width="492" height="492" rx="96" fill="none" stroke="#1f3a1f" stroke-width="4"/>

  <g fill="none" stroke="#33ff66" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pattes -->
    <g stroke-width="9">
      <path d="M152 360v28M178 375v28M204 390v28M230 405v28"/>
      <path d="M282 405v28M308 390v28M334 375v28M360 360v28"/>
    </g>
    <!-- Faces latérales -->
    <path d="M126 195 256 270v150L126 345Z" fill="url(#left)"/>
    <path d="M256 270 386 195v150L256 420Z" fill="url(#right)"/>
    <!-- Face supérieure -->
    <path d="M256 120 386 195 256 270 126 195Z" fill="#0f4a1e"/>
  </g>

  <!-- Pistes du dessus (repère 0..100 projeté sur la face supérieure) -->
  <g transform="matrix(1.3 .75 -1.3 .75 256 120)" fill="none" stroke="#9dff6a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path vector-effect="non-scaling-stroke" d="M36 36h28v28H36Z" fill="#33ff66" fill-opacity=".25"/>
    <path vector-effect="non-scaling-stroke" d="M50 36V14M64 50h22M50 64v12l10 10M36 50H22l-8-8"/>
    <g fill="#9dff6a" stroke="none">
      <circle cx="50" cy="12" r="3.4"/>
      <circle cx="88" cy="50" r="3.4"/>
      <circle cx="62" cy="88" r="3.4"/>
      <circle cx="12" cy="40" r="3.4"/>
    </g>
  </g>
</svg>
